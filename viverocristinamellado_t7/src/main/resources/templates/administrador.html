<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil Administrador</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
	<div class="container">
		<div class="mb-4">
			<img th:src="@{/img/perfil.png}" alt="Icono perfil" width="50">
			<h2>¡Bienvenido ADMIN!</h2>
		</div>

		<div class="d-flex justify-content-center section-container">
			<div class="icon-container">
				<a th:href="@{/registrar-persona}" class="text-decoration-none">
					<img th:src="@{/img/registrar_persona.png}" alt="Persona">
					<p>REGISTRAR PERSONA</p>
				</a>
			</div>
			<div class="icon-container">
				<a th:href="@{/gestion-plantas}" class="text-decoration-none"> <img
					th:src="@{/img/gestion_planta.png}" alt="Plantas">
					<p>GESTIÓN DE PLANTAS</p>
				</a>
			</div>
			<div class="icon-container">
				<a th:href="@{/gestion-ejemplares}" class="text-decoration-none">
					<img th:src="@{/img/gestion_ejemplares.png}" alt="Ejemplares">
					<p>GESTIÓN DE EJEMPLARES</p>
				</a>
			</div>
			<div class="icon-container">
				<a th:href="@{/gestion-mensajes}" class="text-decoration-none">
					<img th:src="@{/img/gestion_mensajes.png}" alt="Mensajes">
					<p>GESTIÓN DE MENSAJES</p>
				</a>
			</div>
		</div>
		<div class="logout-container">
			<form th:action="@{/logout}" method="get">
				<button type="submit" class="btn color-boton">CERRAR SESIÓN</button>
			</form>
		</div>
	</div>

	<script src="/webjars/jquery/jquery.min.js"></script>
	<script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
