<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cliente.css}">
</head>
<body>

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg navbar-light">
    <a class="navbar-brand" href="#">
        <img th:src="@{/img/perfil.png}" alt="Icono perfil">
        Área <span th:text="${session.perfil}"></span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="leftNavItems">
            <li class="nav-item">
                <p class="nav-link" th:text="'¡Hola ' + ${session.usuario}+ '!'"></p>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/clientes/cliente}">Volver a la tienda</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="cerrar-sesion" th:href="@{/auth/logout}">Cerrar Sesión</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <h2>Mi Carrito</h2>
    <div th:if="${session.carrito == null or session.carrito.empty}" class="alert alert-info">
        Tu carrito está vacío
    </div>
    <div th:if="${session.carrito != null and !session.carrito.empty}">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>PLANTA</th>
                    <th>CANTIDAD</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="planta : ${session.carrito}">
                    <td th:text="${planta.key}"></td>
                    <td th:text="${planta.value}"></td>
                </tr>
            </tbody>
        </table>
        
        <div class="text-center mt-3">
            <form th:action="@{/carrito/realizar-pedido}" method="POST" style="display: inline;">
                <button type="submit" class="btn btn-info rounded-pill px-3">Realizar Pedido</button>
            </form>
            <form th:action="@{/carrito/eliminar-pedido}" method="POST" style="display: inline;">
                <button type="submit" class="btn btn-danger rounded-pill px-3">Eliminar pedido</button>
            </form>
        </div>
    </div>
</div>

<!-- Scripts de Bootstrap -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
