<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Registrar-cliente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
	<div class="container mt-3">
    <div class="mb-2 text-center">
        <img th:src="@{/img/cliente.png}" alt="Icono cliente" width="50">
        <h1>Alta de Cliente</h1>
    </div>
    <div class="card shadow-lg p-4 mx-auto" style="max-width: 500px;">
        <form th:action="@{/clientes/registrar-cliente}" method="post">
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nombre" 
                           name="nombre" placeholder="Nombre" required>
                    <label for="nombre">Nombre</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="date" class="form-control" id="fechaNac" 
                           name="fechaNac" required>
                    <label for="fechaNac">Fecha de Nacimiento</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nifnie" 
                           name="nifnie" placeholder="NIF/NIE" required>
                    <label for="nifnie">NIF/NIE</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="direccion" 
                           name="direccion" placeholder="Dirección" required>
                    <label for="direccion">Dirección</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" 
                           name="email" placeholder="Email" required>
                    <label for="email">Email</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="tel" class="form-control" id="telefono" 
                           name="telefono" placeholder="Teléfono" required>
                    <label for="telefono">Teléfono</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Datos de Acceso</legend>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="usuario" 
                           name="usuario" placeholder="Usuario" required>
                    <label for="usuario">Usuario</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" 
                           name="password" placeholder="Contraseña" required>
                    <label for="password">Contraseña</label>
                </div>
            </fieldset>

            <button type="submit" class="btn color-boton">Registrar</button>
        	<button onclick="window.location.href='/volver'" type="button" class="btn color-boton">Volver</button>
        </form>
    </div>
    <div class="alert alert-primary" role="alert" th:if="${mensajeResultado!=null and res.equals('ok')}">
        <p th:text="${mensajeResultado}"></p>
    </div>
    <div class="alert alert-danger" role="alert" th:if="${mensajeResultado!=null and res.equals('ko')}">
        <p th:text="${mensajeResultado}"></p>
    </div>
</div>
	
	<script src="/webjars/jquery/jquery.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
