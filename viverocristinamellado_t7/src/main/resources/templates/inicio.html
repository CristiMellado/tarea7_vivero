<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" th:href="@{/css/styles.css}">
<link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>
<body>

    <h1>VIVERO</h1>
    <div class="container">
        <div class="tabla-container">
            <h1>
                <img th:src="@{/img/planta.png}" alt="planta" width="40">Plantas
            </h1>
            <table>
                <tr>
                    <th>ID PLANTA</th>
                    <th>CÓDIGO</th>
                    <th>NOMBRE COMÚN</th>
                    <th>NOMBRE CIENTÍFICO</th>
                </tr>
                <tr th:each="planta : ${plantas}">
                    <td th:text="${planta.id}"></td>
                    <td th:text="${planta.codigo}"></td>
                    <td th:text="${planta.nombreComun}"></td>
                    <td th:text="${planta.nombreCientifico}"></td>
                </tr>
            </table>
        </div>

        <div class="formulario">
            <form th:action="@{/auth/login}" method="post">
                <img th:src="@{/img/login.png}" alt="Icono login" width="90">
                <h1>Login</h1>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput"
                           name="username" placeholder="Introduce tu usuario" required>
                    <label for="floatingInput">Introduce tu usuario</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="floatingPassword"
                           name="password" placeholder="Introduce tu contraseña" required>
                    <label for="floatingPassword">Introduce tu contraseña</label>
                </div>
                <div>
                    <button type="submit" class="btn color-boton">INICIAR SESIÓN</button>
                    <a th:href="@{/clientes/registrar-cliente}" class="btn color-boton-registro">ALTA CLIENTE</a>
                </div>
            </form>
            <div class="alert alert-danger" role="alert" th:if="${mensajeError!=null}">
                <p th:text="${mensajeError}"></p>
            </div>
        </div>
    </div>

    <script src="/webjars/jquery/jquery.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
